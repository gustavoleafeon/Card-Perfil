<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="https://cdna.artstation.com/p/users/avatars/007/560/990/large/8c3d714b8b19ff6420ca10baa88dbf2f.jpg?1688657749"
        type="image/x-icon">
    <title>Perfil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            background: linear-gradient(135deg, #f0ffae, #2e5228);
            color: #333;
            padding: 16px;
        }

        main {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .card {
            width: min(100%, 420px);
            background: #e1e2df;
            border: 2px solid #000;
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2), 0 10px 20px rgba(0, 0, 0, 1);
            overflow: hidden;
            padding: 28px;
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid rgba(69, 69, 69, 0.95);
            object-fit: cover;
            margin: 0 auto 22px;
            display: block;
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 17px;
            font-weight: 500;
            color: #000000;
            margin-bottom: 18px;
        }

        p.description {
            font-size: 14px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 24px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .skill {
            background: #f3f4ff;
            padding: 10px 14px;
            border-radius: 999px;
            font-size: 13px;
            color: #444;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);
        }

        .button-group {
            display: flex;
            justify-content: center;
        }

        .button-gradient {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            border: 2px solid #000;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #f0ffae, #2e5228);
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 7px 15px rgba(0, 0, 0, 1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .button-gradient:hover {
            transform: translateY(2px);
            box-shadow: 0 18px 38px rgba(16, 116, 21, 0.28);
        }

        .button-gradient:active {
            filter: brightness(0.8);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main>
        <article class="card">

            <figure>
                <img class="avatar"
                    src="https://cdnb.artstation.com/p/assets/images/images/079/684/245/large/eu_gus-untitled-09-05-2024-04-18-05.jpg?1725542646"
                    alt="Foto de perfil">
                <figcaption class="sr-only">Foto de perfil de Gustavo Souza</figcaption>
            </figure>

            <h1>Gustavo Messias</h1>

            <h2>Designer e Desenvolvedor Web</h2>

            <p class="description">designer de animação, ilustrador e estudante de Técnico em Informática para Internet
                em senac São Paulo</p>

            <h2><STRong>HABILIDADES</STRong></h2>

            <section class="skills" aria-label="Habilidades">
                <span class="skill">HTML</span>
                <span class="skill">CSS</span>
                <span class="skill">figma</span>
                <span class="skill">Maya</span>
                <span class="skill">Krita</span>
            </section>

            <div class="button-group">
                <a class="button-gradient" href="https://www.artstation.com/gustavomessias5/albums/8192426"
                    target="_blank">Ver Portfólio</a>
            </div>

        </article>

    </main>

    <footer>

        <p>&copy; 2026 Gustavo Messias Santana de Souza. Todos os direitos reservados.</p>

    </footer>

</body>

</html>
